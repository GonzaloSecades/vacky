name: vacky

services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vacky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacky_local}
      POSTGRES_DB: vacky_dev
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d vacky_dev',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
