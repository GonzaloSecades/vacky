services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacky}
      POSTGRES_USER: ${POSTGRES_USER:-vacky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacky}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER:-vacky}" -d "$${POSTGRES_DB:-vacky}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
